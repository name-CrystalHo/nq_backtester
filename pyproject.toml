[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nq-backtester"
version = "0.1.0"
description = "High-performance Python tick data backtester using full order book simulation from NinjaTrader data"
authors = [
    {name = "User", email = "user@example.com"},
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "fastparquet>=0.8.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "python-dateutil>=2.8.0",
    "click>=8.0.0",
    "tqdm>=4.65.0",
    "numba>=0.57.0",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
nq-converter = "backtester.data.converter:cli"
nq-backtest = "backtester.cli:main"

[tool.black]
line-length = 88
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true